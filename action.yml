name: pr-analysis
description: Revisor de PRs
inputs:
  greeting:
    description: descricao do campo greeting
    required: false
    default: default descricao do campo greeting
  ignore-paths:
    description: Paths que devem ser ignorados
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Filter ignored paths
      shell: bash
      run: |
        BASE="${{ github.event.pull_request.base.sha }}"
        HEAD="${{ github.event.pull_request.head.sha }}"

        git diff --name-only "$BASE...$HEAD" > changed-files.txt

        echo "ANTES:"
        cat changed-files.txt

        printf '%s\n' "${{ inputs.ignore-paths }}" > ignore-patterns.txt

        if [ -s ignore-patterns.txt ]; then
          git ls-files \
            --cached \
            --ignored \
            --exclude-from=ignore-patterns.txt \
            > ignored-files.txt

          grep -Fvx -f ignored-files.txt changed-files.txt > filtered-files.txt || true
        else
          cp changed-files.txt filtered-files.txt
        fi

        echo "DEPOIS:"
        cat filtered-files.txt
    - name: Show PR info
      run: |
        echo "Base branch: ${{ github.event.pull_request.base.ref }}"
        echo "Base SHA:    ${{ github.event.pull_request.base.sha }}"
        echo "Head branch: ${{ github.event.pull_request.head.ref }}"
        echo "Head SHA:    ${{ github.event.pull_request.head.sha }}"
        git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}" \
          && echo "base OK" \
          || echo "base AUSENTE"

        git cat-file -e "${{ github.event.pull_request.head.sha }}^{commit}" \
          && echo "head OK" \
          || echo "head AUSENTE"
          
        git diff --name-only \
          "${{ github.event.pull_request.base.sha }}"..."${{ github.event.pull_request.head.sha }}"
      shell: bash
    - name: Greeting
      run: echo ${{ inputs.greeting }}
      shell: bash